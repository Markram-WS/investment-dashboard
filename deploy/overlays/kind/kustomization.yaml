apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

images:
  - name: investment-dashboard/backend
    newName: localhost/investment-dashboard/backend
    newTag: dev
  - name: investment-dashboard/frontend
    newName: localhost/investment-dashboard/frontend
    newTag: dev

patches:
  - target:
      kind: Service
      name: frontend
    patch: |-
      - op: replace
        path: /spec/type
        value: NodePort
      - op: add
        path: /spec/ports/0/nodePort
        value: 30080

  - target:
      kind: Deployment
      name: backend
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: backend
      spec:
        template:
          spec:
            containers:
              - name: backend
                imagePullPolicy: IfNotPresent

  - target:
      kind: Deployment
      name: frontend
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: frontend
      spec:
        template:
          spec:
            containers:
              - name: frontend
                imagePullPolicy: IfNotPresent

  - target:
      kind: StatefulSet
      name: postgres-main
    patch: |-
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: postgres-main
      spec:
        volumeClaimTemplates:
          - metadata:
              name: data
            spec:
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 1Gi
        template:
          spec:
            containers:
              - name: postgres
                resources:
                  requests:
                    cpu: 100m
                    memory: 128Mi

  - target:
      kind: StatefulSet
      name: postgres-ai
    patch: |-
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: postgres-ai
      spec:
        volumeClaimTemplates:
          - metadata:
              name: data
            spec:
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 1Gi
        template:
          spec:
            containers:
              - name: postgres
                resources:
                  requests:
                    cpu: 100m
                    memory: 128Mi
