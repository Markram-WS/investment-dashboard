apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: investment-dashboard

resources:
  - namespace.yaml
  - postgres-main.yaml
  - postgres-ai.yaml
  - backend.yaml
  - frontend.yaml

secretGenerator:
  - name: app-secrets
    envs:
      - secrets.env
    options:
      disableNameSuffixHash: true
