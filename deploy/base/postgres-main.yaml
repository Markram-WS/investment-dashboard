apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-main
  labels:
    app.kubernetes.io/name: postgres-main
    app.kubernetes.io/part-of: investment-dashboard
spec:
  serviceName: postgres-main
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres-main
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres-main
        app.kubernetes.io/part-of: investment-dashboard
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: POSTGRES_DB
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U "$POSTGRES_USER"
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 12
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-main
  labels:
    app.kubernetes.io/name: postgres-main
    app.kubernetes.io/part-of: investment-dashboard
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: postgres-main
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      protocol: TCP
