version: '3.8'
services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - VITE_API_URL=http://backend:8000
    networks:
      - investment-network
    restart: unless-stopped
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    expose:
      - "8000"
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - investment-network
    restart: unless-stopped
  db_main:
    image: postgres:15-alpine
    container_name: investment_db_main
    environment:
      POSTGRES_USER: investment_user
      POSTGRES_PASSWORD: investment_pass
      POSTGRES_DB: investment_main
    volumes:
      - postgres_main_data:/var/lib/postgresql/data
    networks:
      - investment-network
    restart: unless-stopped
  db_ai:
    image: postgres:15-alpine
    container_name: investment_db_ai
    environment:
      POSTGRES_USER: ai_user
      POSTGRES_PASSWORD: ai_pass
      POSTGRES_DB: investment_ai
    volumes:
      - postgres_ai_data:/var/lib/postgresql/data
    networks:
      - investment-network
    restart: unless-stopped
networks:
  investment-network:
    driver: bridge
volumes:
  postgres_main_data:
  postgres_ai_data: