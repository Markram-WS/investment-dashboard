version: '3.9'

services:
  backend:
    build: .
    container_name: investment_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://dashboard:dashboard@db_main:5432/investment_main
      - AI_DATABASE_URL=postgresql+asyncpg://dashboard:dashboard@db_ai:5433/investment_ai
      - PYTHONPATH=/app
    depends_on:
      - db_main
      - db_ai

  db_main:
    image: postgres:16-alpine
    container_name: investment_db_main
    restart: unless-stopped
    environment:
      POSTGRES_DB: investment_main
      POSTGRES_USER: dashboard
      POSTGRES_PASSWORD: dashboard
    volumes:
      - pg_main_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  db_ai:
    image: postgres:16-alpine
    container_name: investment_db_ai
    restart: unless-stopped
    environment:
      POSTGRES_DB: investment_ai
      POSTGRES_USER: dashboard
      POSTGRES_PASSWORD: dashboard
    volumes:
      - pg_ai_data:/var/lib/postgresql/data
    ports:
      - "5433:5433"

volumes:
  pg_main_data:
  pg_ai_data: